<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TRJV Enduro — Classement en direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand-group">
    <img src="logoclub.png" alt="Logo du club" class="club-logo" onerror="this.remove()">
    <div class="brand">TRJV <span>ENDURO</span></div>
  </div>
  <div class="dim page-tag">Classement public</div>
  <div class="conn-indicator">
    <span class="dot" id="conn-dot"></span>
    <span id="conn-label">Connexion…</span>
  </div>
</header>

<main>
  <div class="public-header">
    <h1 id="public-event-name">Chargement de la course…</h1>
    <div class="subtitle">Classement mis à jour en temps réel — lecture seule</div>
  </div>

  <div class="panel filters-sticky">
    <div class="filters-bar">
      <div class="field" style="min-width:200px;">
        <label for="p-search">Recherche</label>
        <input type="search" id="p-search" placeholder="Nom, prénom, dossard…">
      </div>
      <div class="field" style="max-width:180px;">
        <label for="p-categorie">Catégorie</label>
        <select id="p-categorie"></select>
      </div>
      <div class="field" style="max-width:160px;">
        <label for="p-sexe">Sexe</label>
        <select id="p-sexe">
          <option value="">Tous</option>
          <option value="H">H</option>
          <option value="F">F</option>
        </select>
      </div>
      <div class="field" style="max-width:220px;">
        <label for="p-sort">Trier par</label>
        <select id="p-sort"></select>
      </div>
    </div>
  </div>

  <div id="p-legend" class="legend-row"></div>

  <div id="p-list" class="leaderboard-list"></div>

  <footer class="readonly-note">Interface spectateurs — aucune action possible ici. Rendez-vous au poste de chronométrage pour toute correction.</footer>
</main>

<script type="module">
  import { watchConnection, watchEventConfig, watchRiders, watchTiming } from "./firebase.js";
  import { computeClassement, sortRows, spKeys } from "./classement.js";

  const state = {
    config: null, riders: {}, timing: {},
    filters: { search: "", categorie: "", sexe: "" },
    sort: { key: "positionGenerale", dir: "asc" }
  };

  function $(sel) { return document.querySelector(sel); }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function formatMs(ms) {
    if (ms === null || ms === undefined || isNaN(ms)) return "—";
    const totalMs = Math.max(0, Math.round(ms));
    const h = Math.floor(totalMs / 3600000);
    const m = Math.floor((totalMs % 3600000) / 60000);
    const s = Math.floor((totalMs % 60000) / 1000);
    const cs = Math.floor((totalMs % 1000) / 10);
    const pad = (n) => String(n).padStart(2, "0");
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}.${pad(cs)}` : `${pad(m)}:${pad(s)}.${pad(cs)}`;
  }
  function positionClass(pos) {
    if (pos === 1) return "gold";
    if (pos === 2) return "silver";
    if (pos === 3) return "bronze";
    return "";
  }
  function statutLabel(s) { return s === "ATTENTE" ? "En attente" : s === "EN_COURSE" ? "En course" : "Arrivé"; }
  function statutClass(s) { return s === "ATTENTE" ? "attente" : s === "EN_COURSE" ? "en-course" : "arrive"; }

  watchConnection((status) => {
    const dot = $("#conn-dot"), label = $("#conn-label");
    dot.className = "dot " + (status === "online" ? "online" : "offline");
    label.textContent = status === "online" ? "En direct" : "Connexion perdue";
  });

  watchEventConfig((config) => {
    state.config = config;
    if (config?.eventName) $("#public-event-name").textContent = config.eventName;
    populateSortOptions();
    render();
  });
  watchRiders((riders) => { state.riders = riders; render(); });
  watchTiming((timing) => { state.timing = timing; render(); });

  const catSelect = $("#p-categorie");
  catSelect.innerHTML = `<option value="">Toutes catégories</option>` +
    ["U11", "U13", "U15", "U17"].map((c) => `<option value="${c}">${c}</option>`).join("");
  catSelect.addEventListener("change", (e) => { state.filters.categorie = e.target.value; render(); });
  $("#p-sexe").addEventListener("change", (e) => { state.filters.sexe = e.target.value; render(); });
  $("#p-search").addEventListener("input", (e) => { state.filters.search = e.target.value; render(); });
  $("#p-sort").addEventListener("change", (e) => {
    const [key, dir] = e.target.value.split("|");
    state.sort = { key, dir: dir || "asc" };
    render();
  });

  function populateSortOptions() {
    const spList = spKeys(state.config?.numSpeciales || 0);
    const sortSelect = $("#p-sort");
    const options = [
      { value: "positionGenerale|asc", label: "Classement général" },
      { value: "nom|asc", label: "Nom (A → Z)" },
      { value: "dossard|asc", label: "N° de dossard" },
      ...spList.map((sp) => ({ value: `sp:${sp}:tempsRetenu|asc`, label: `Temps ${sp}` }))
    ];
    sortSelect.innerHTML = options.map((o) => `<option value="${o.value}">${o.label}</option>`).join("");
  }

  function spChip(sp, cell) {
    if (!cell) return "";
    const stateClass = cell.statut === "ARRIVE" ? "sp-chip-arrive" : cell.statut === "EN_COURSE" ? "sp-chip-course blink-orange" : "sp-chip-attente";
    const timeLabel = cell.statut === "ARRIVE" ? formatMs(cell.tempsRetenu) : cell.statut === "EN_COURSE" ? "En course" : "—";
    let marks = "";
    if (cell.penalite) marks += `<span class="sp-chip-mark" title="Pénalité appliquée">⚠</span>`;
    if (cell.neutralisation) marks += `<span class="sp-chip-mark" title="Spéciale neutralisée">Ø</span>`;
    return `
      <div class="sp-chip ${stateClass}">
        <span class="sp-chip-label">${esc(sp)}</span>
        <span class="sp-chip-time mono">${timeLabel}</span>
        ${marks}
      </div>`;
  }

  function renderCard(r, spList) {
    const chips = spList.map((sp) => spChip(sp, r.parSP[sp])).join("");
    const ecart = r.tempsFinal !== null
      ? (r.positionGenerale === 1 ? "Meneur" : (r.ecartPremier ? "+" + formatMs(r.ecartPremier) + " sur le 1er" : "—"))
      : "";
    const liaisonNote = (state.config?.liaisonsEnabled && r.totalLiaison > 0)
      ? `<div class="lc-liaison">dont ${formatMs(r.totalLiaison)} de liaison</div>`
      : "";

    return `
      <div class="leaderboard-card">
        <div class="lc-top-row">
          <div class="lc-pos"><span class="position-badge ${positionClass(r.positionGenerale)}">${r.positionGenerale ?? "—"}</span></div>
          <span class="plate ${r.statutGlobal === "EN_COURSE" ? "on-track blink-orange" : r.statutGlobal === "ARRIVE" ? "arrived" : ""}">${esc(r.dossard)}</span>
          <div class="lc-name">
            <div class="name">${esc(r.nom)} ${esc(r.prenom)}</div>
            <div class="meta">
              <span class="cat-badge">${esc(r.categorie)}</span>
              <span class="sex-badge">${esc(r.sexe)}</span>
              ${esc(r.club || "Sans club")}
            </div>
          </div>
          <div class="lc-time">
            <div class="final mono">${formatMs(r.tempsFinal)}</div>
            <div class="ecart mono">${ecart}</div>
          </div>
        </div>
        <div class="lc-status-row">
          <span class="status-tag status-${statutClass(r.statutGlobal)}">${statutLabel(r.statutGlobal)}</span>
          ${liaisonNote}
        </div>
        <div class="sp-chip-row">${chips}</div>
      </div>`;
  }

  function render() {
    const { rows, spList } = computeClassement(state.riders, state.timing, state.config || {});
    let filtered = rows;
    const { search, categorie, sexe } = state.filters;
    if (search) {
      const s = search.toLowerCase();
      filtered = filtered.filter((r) => [r.nom, r.prenom, r.dossard].join(" ").toLowerCase().includes(s));
    }
    if (categorie) filtered = filtered.filter((r) => r.categorie === categorie);
    if (sexe) filtered = filtered.filter((r) => r.sexe === sexe);
    filtered = sortRows(filtered, state.sort.key, state.sort.dir);

    const legend = $("#p-legend");
    legend.innerHTML = spList.map((sp) => `<span class="legend-item"><span class="legend-dot"></span>${esc(sp)}</span>`).join("") ||
      `<span class="dim">Aucune spéciale configurée pour le moment.</span>`;

    const list = $("#p-list");
    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state">En attente des premiers résultats…</div>`;
      return;
    }
    list.innerHTML = filtered.map((r) => renderCard(r, spList)).join("");
  }
</script>
</body>
</html>
